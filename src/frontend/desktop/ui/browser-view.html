<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>ChatGPT — Workflow Pilot</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#fff;font:13px system-ui}
  @media (prefers-color-scheme: dark){html,body{background:#1b1d22;color:#ddd}}
  #frame{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;user-select:none;-webkit-user-drag:none;cursor:default}
  #keys{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;border:0;padding:0;resize:none}
  #status{position:absolute;left:50%;top:40%;transform:translateX(-50%);padding:10px 14px;border-radius:8px;background:rgba(127,127,127,.15)}
  #status[hidden]{display:none}
</style>
</head>
<body>
<img id="frame" alt="" draggable="false">
<textarea id="keys" aria-label="Ввод в ChatGPT" autocomplete="off" spellcheck="false"></textarea>
<div id="status">Подключение к Workflow Pilot…</div>
<script type="module" src="./browser-view.mjs"></script>
</body>
</html>
